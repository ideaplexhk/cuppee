name: verify

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cuppee
          POSTGRES_PASSWORD: cuppee
          POSTGRES_DB: cuppee_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cuppee" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://cuppee:cuppee@localhost:5432/cuppee_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # Screenshots (scripts/verify.sh --screens + Playwright) are switched on by backlog task M0.3.
      - name: Verify (type checks and tests)
        run: bash scripts/verify.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: screenshots/
          if-no-files-found: ignore
